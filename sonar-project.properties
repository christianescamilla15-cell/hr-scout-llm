# SonarQube project configuration.
# Used by the sonar-scanner-cli container when run with `--profile sonar-scan`.
#
# To run a scan against the local SonarQube (after `--profile sonar` is up):
#   1. Open http://localhost:9000 (admin/admin → change pwd → create project key
#      "hrscout" → generate user token → export as SONAR_TOKEN in .env.docker)
#   2. docker compose --profile sonar-scan up sonar-scanner

sonar.projectKey=hrscout
sonar.projectName=HRScout
sonar.projectVersion=1.0

# What to scan
sonar.sources=backend/app,src
sonar.tests=backend/tests,src/auth/__tests__,src/pages/__tests__,src/components/analysis/__tests__,src/constants/__tests__

# Language hints
sonar.python.version=3.12
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

# Excludes
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/alembic/versions/**,**/*.min.js,**/coverage/**,backend/scripts/seed_demo.py
sonar.test.exclusions=**/__tests__/**

# Quality thresholds — let the SonarQube quality gate UI manage these
# (community edition supports custom gates but configuration is server-side)

# Encoding
sonar.sourceEncoding=UTF-8
